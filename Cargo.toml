[package]
name = "bitvmx-broker"
version = "0.8.2"
edition = "2021"
description = "BitVMX Broker"
keywords = ["BitVMX", "Broker"]
repository = "https://github.com/FairgateLabs/rust-bitvmx-broker"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3"
tarpc = { version = "0.38.0", features = ["full"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-serde = "0.9.0"
tracing = { version = "0.1.44" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.2" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.2" }
tokio-rustls = "0.26.4"
tokio-util = "0.7.19"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"
ring = "0.17.14"
hex = "0.4.3"
serde_yaml = "0.9.33"
rcgen = "0.12.0"                                                                                                          # Do not update
rsa = "0.9.10"
sha2 = "0.11.0"
pem = "4.0.0"
serde_json = "1.0.151"
time = "0.3.55"

[dev-dependencies]
ctrlc = "3.5.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.27.0"
